<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cricket Player Selection</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
    }

    h2 {
      margin-top: 0;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    #status {
      text-align: center;
      min-height: 24px;
      margin: 10px 0 20px;
      font-weight: bold;
    }

    .card {
      background: #fff;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      margin-bottom: 20px;
    }

    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
    }

    .player-card {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      background: #fafafa;
    }

    .player-name {
      font-weight: bold;
      text-align: center;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      word-break: break-word;
    }

    .player-team {
      text-align: center;
      font-size: 12px;
      color: #666;
      min-height: 20px;
      margin: 4px 0 8px;
    }

    .player-actions {
      display: flex;
      gap: 6px;
    }

    button {
      border: none;
      border-radius: 7px;
      padding: 11px 15px;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(.98);
    }

    .player-actions button {
      flex: 1;
      padding: 10px 5px;
      font-size: 13px;
    }

    .team1-btn {
      background: #1976d2;
    }

    .team2-btn {
      background: #f57c00;
    }

    .remove-btn {
      background: #777;
      width: 100%;
      margin-top: 6px;
      font-size: 12px;
      padding: 8px;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .team-summary {
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      min-height: 180px;
    }

    .team1-summary {
      border-top: 5px solid #1976d2;
    }

    .team2-summary {
      border-top: 5px solid #f57c00;
    }

    .summary-player {
      background: #f5f5f5;
      padding: 10px;
      margin: 7px 0;
      border-radius: 7px;
    }

    .empty {
      color: #888;
      text-align: center;
      padding: 25px 5px;
    }

    .count {
      text-align: center;
      font-weight: bold;
      margin: 8px 0 12px;
    }

    .button-area {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 25px 0;
    }

    .primary {
      background: #1976d2;
    }

    .secondary {
      background: #757575;
    }

    .success {
      background: #4caf50;
    }

    .shuffle {
      background: #673ab7;
    }

    .save {
      background: #00897b;
    }

    .batting-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .batting-team {
      background: white;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }

    .batting-player {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f5f5f5;
      border-radius: 8px;
      padding: 10px;
      margin: 8px 0;
    }

    .batting-number {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 50%;
      background: #1976d2;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .team2-order .batting-number {
      background: #f57c00;
    }

    #saveMessage {
      text-align: center;
      font-weight: bold;
      margin: 15px 0;
      min-height: 25px;
    }

    .success-message {
      color: #2e7d32;
    }

    .error-message {
      color: #c62828;
    }

    /* PIN MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 1000;
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 360px;
      background: white;
      border-radius: 14px;
      padding: 25px;
      text-align: center;
    }

    #pinInput {
      width: 100%;
      padding: 14px;
      font-size: 24px;
      text-align: center;
      letter-spacing: 8px;
      border: 2px solid #ddd;
      border-radius: 8px;
    }

    .pin-error {
      color: #c62828;
      min-height: 22px;
      margin-top: 10px;
      font-weight: bold;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .modal-buttons button {
      flex: 1;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      body {
        padding: 8px;
      }

      h1 {
        font-size: 23px;
      }

      .players-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .player-card {
        padding: 9px;
      }

      .player-name {
        font-size: 14px;
        min-height: 38px;
      }

      .player-actions button {
        font-size: 11px;
        padding: 10px 3px;
      }

      .summary {
        grid-template-columns: 1fr;
      }

      .batting-grid {
        grid-template-columns: 1fr;
      }

      .button-area {
        flex-direction: column;
      }

      .button-area button {
        width: 100%;
      }
    }

  </style>
</head>

<body>

<div class="container">

  <!-- SCREEN 1 -->

  <div id="screen1" class="screen active">

    <h1>🏏 Create Teams</h1>

    <div id="status">Loading players...</div>

    <div class="card">

      <h2>Assign Players</h2>

      <div id="allPlayers" class="players-grid"></div>

    </div>

    <div class="summary">

      <div class="team-summary team1-summary">

        <h2>🔵 Team 1</h2>

        <div class="count">
          Players: <span id="team1Count">0</span>
        </div>

        <div id="team1Summary"></div>

      </div>

      <div class="team-summary team2-summary">

        <h2>🟠 Team 2</h2>

        <div class="count">
          Players: <span id="team2Count">0</span>
        </div>

        <div id="team2Summary"></div>

      </div>

    </div>

    <div class="button-area">

      <button class="secondary" onclick="clearTeams()">
        Clear Teams
      </button>

      <button class="success" onclick="goToBattingOrder()">
        Assign Batting Order →
      </button>

    </div>

  </div>


  <!-- SCREEN 2 -->

  <div id="screen2" class="screen">

    <h1>🏆 Batting Order</h1>

    <div class="batting-grid">

      <div class="batting-team">

        <h2>🔵 Team 1</h2>

        <div id="battingTeam1"></div>

      </div>

      <div class="batting-team">

        <h2>🟠 Team 2</h2>

        <div id="battingTeam2" class="team2-order"></div>

      </div>

    </div>

    <div id="saveMessage"></div>

    <div class="button-area">

      <button class="secondary" onclick="changeTeams()">
        ← Change Teams
      </button>

      <button class="shuffle" onclick="generateBattingOrders()">
        🎲 Regenerate
      </button>

      <button class="save" onclick="openPinModal()">
        💾 Save Batting Orders
      </button>

      <button class="primary" onclick="startAgain()">
        Start Again
      </button>

    </div>

  </div>

</div>


<!-- PIN MODAL -->

<div id="pinModal" class="modal">

  <div class="modal-content">

    <h2>🔐 Enter PIN</h2>

    <p>Enter the 4-digit PIN to save.</p>

    <input
      type="password"
      id="pinInput"
      inputmode="numeric"
      maxlength="4"
      placeholder="••••"
    >

    <div id="pinError" class="pin-error"></div>

    <div class="modal-buttons">

      <button class="secondary" onclick="closePinModal()">
        Cancel
      </button>

      <button class="save" onclick="verifyPinAndSave()">
        Save
      </button>

    </div>

  </div>

</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzLpnsEmypbynjiTA9jFVkvbw8YyALOe7q3boFgBNk-djd7xmPfWgIdRfDnh_C0L_yX/exec";

const SAVE_PIN = "7777";

const CACHE_KEY = "cricketPlayers";

let allPlayers = [];
let team1 = [];
let team2 = [];


/* LOAD PLAYERS */

function loadPlayers() {

  const status = document.getElementById("status");

  try {

    const cached = localStorage.getItem(CACHE_KEY);

    if (cached) {

      allPlayers = JSON.parse(cached);

      if (allPlayers.length > 0) {

        renderPlayers();

        status.innerText =
          `${allPlayers.length} players loaded`;

      }

    }

  } catch (error) {
    console.log("Cache error", error);
  }


  fetch(API_URL)

    .then(response => {

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      return response.json();

    })

    .then(data => {

      if (!data.success) {
        throw new Error(data.error || "Failed to load players");
      }

      allPlayers = data.players || [];

      localStorage.setItem(
        CACHE_KEY,
        JSON.stringify(allPlayers)
      );

      renderPlayers();

      status.innerText =
        `${allPlayers.length} players loaded`;

    })

    .catch(error => {

      console.error(error);

      if (allPlayers.length === 0) {

        status.innerText =
          "❌ Failed to load players";

      }

    });

}


/* RENDER PLAYER CARDS */

function renderPlayers() {

  const container =
    document.getElementById("allPlayers");

  container.innerHTML = "";


  allPlayers.forEach(player => {

    const card =
      document.createElement("div");

    card.className = "player-card";


    let currentTeam = "";

    if (team1.some(p => p.id === player.id)) {
      currentTeam = "🔵 Team 1";
    }

    if (team2.some(p => p.id === player.id)) {
      currentTeam = "🟠 Team 2";
    }


    card.innerHTML = `

      <div class="player-name">
        ${escapeHtml(player.name)}
      </div>

      <div class="player-team">
        ${currentTeam || "Not assigned"}
      </div>

      <div class="player-actions">

        <button
          class="team1-btn"
          onclick="assignPlayer('${player.id}', 'team1')"
        >
          🔵 Team 1
        </button>

        <button
          class="team2-btn"
          onclick="assignPlayer('${player.id}', 'team2')"
        >
          🟠 Team 2
        </button>

      </div>

      ${
        currentTeam
          ? `
            <button
              class="remove-btn"
              onclick="removePlayer('${player.id}')"
            >
              Remove
            </button>
          `
          : ""
      }

    `;


    container.appendChild(card);

  });


  renderTeamSummary();

}


/* ASSIGN PLAYER */

function assignPlayer(playerId, targetTeam) {

  const player =
    allPlayers.find(p => p.id === playerId);

  if (!player) return;


  team1 =
    team1.filter(p => p.id !== playerId);

  team2 =
    team2.filter(p => p.id !== playerId);


  if (targetTeam === "team1") {

    team1.push(player);

  } else {

    team2.push(player);

  }


  renderPlayers();

}


/* REMOVE PLAYER */

function removePlayer(playerId) {

  team1 =
    team1.filter(p => p.id !== playerId);

  team2 =
    team2.filter(p => p.id !== playerId);

  renderPlayers();

}


/* TEAM SUMMARY */

function renderTeamSummary() {

  document.getElementById("team1Count").innerText =
    team1.length;

  document.getElementById("team2Count").innerText =
    team2.length;


  const team1Container =
    document.getElementById("team1Summary");

  const team2Container =
    document.getElementById("team2Summary");


  team1Container.innerHTML =
    team1.length === 0
      ? `<div class="empty">No players assigned</div>`
      : team1.map(player =>
          `<div class="summary-player">
            ${escapeHtml(player.name)}
          </div>`
        ).join("");


  team2Container.innerHTML =
    team2.length === 0
      ? `<div class="empty">No players assigned</div>`
      : team2.map(player =>
          `<div class="summary-player">
            ${escapeHtml(player.name)}
          </div>`
        ).join("");

}


/* CLEAR TEAMS */

function clearTeams() {

  if (!confirm("Clear both teams?")) {
    return;
  }

  team1 = [];
  team2 = [];

  renderPlayers();

}


/* GO TO BATTING ORDER */

function goToBattingOrder() {

  if (team1.length === 0 || team2.length === 0) {

    alert(
      "Please assign at least one player to each team."
    );

    return;

  }


  document.getElementById("screen1")
    .classList.remove("active");

  document.getElementById("screen2")
    .classList.add("active");


  generateBattingOrders();

}


/* GENERATE RANDOM ORDERS */

function generateBattingOrders() {

  team1 = generateOrder(team1);
  team2 = generateOrder(team2);

  renderBattingOrders();

}


function generateOrder(team) {

  const shuffled = [...team];


  for (
    let i = shuffled.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(Math.random() * (i + 1));

    [shuffled[i], shuffled[j]] =
      [shuffled[j], shuffled[i]];

  }


  return shuffled.map(
    (player, index) => ({
      ...player,
      battingOrder: index + 1
    })
  );

}


/* DISPLAY BATTING ORDER */

function renderBattingOrders() {

  const team1Container =
    document.getElementById("battingTeam1");

  const team2Container =
    document.getElementById("battingTeam2");


  team1Container.innerHTML =
    team1.map(player => `

      <div class="batting-player">

        <div class="batting-number">
          ${player.battingOrder}
        </div>

        <div>
          ${escapeHtml(player.name)}
        </div>

      </div>

    `).join("");


  team2Container.innerHTML =
    team2.map(player => `

      <div class="batting-player">

        <div class="batting-number">
          ${player.battingOrder}
        </div>

        <div>
          ${escapeHtml(player.name)}
        </div>

      </div>

    `).join("");

}


/* CHANGE TEAMS */

function changeTeams() {

  document.getElementById("screen2")
    .classList.remove("active");

  document.getElementById("screen1")
    .classList.add("active");

}


/* START AGAIN */

function startAgain() {

  team1 = [];
  team2 = [];

  document.getElementById("saveMessage").innerText = "";

  document.getElementById("screen2")
    .classList.remove("active");

  document.getElementById("screen1")
    .classList.add("active");

  renderPlayers();

}


/* PIN MODAL */

function openPinModal() {

  document.getElementById("pinInput").value = "";
  document.getElementById("pinError").innerText = "";

  document.getElementById("pinModal")
    .classList.add("show");

  setTimeout(() => {
    document.getElementById("pinInput").focus();
  }, 100);

}


function closePinModal() {

  document.getElementById("pinModal")
    .classList.remove("show");

}


/* VERIFY PIN */

function verifyPinAndSave() {

  const pin =
    document.getElementById("pinInput")
      .value.trim();

  const error =
    document.getElementById("pinError");


  if (pin !== SAVE_PIN) {

    error.innerText =
      "❌ Incorrect PIN";

    document.getElementById("pinInput").value = "";

    return;

  }


  closePinModal();

  saveBattingOrders();

}


/* SAVE TO GOOGLE SHEETS */

async function saveBattingOrders() {

  const message =
    document.getElementById("saveMessage");


  const assignments = [

    ...team1.map(player => ({
      id: player.id,
      battingOrder: player.battingOrder
    })),

    ...team2.map(player => ({
      id: player.id,
      battingOrder: player.battingOrder
    }))

  ];


  message.innerText =
    "Saving batting orders...";

  message.className = "";


  try {

    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({

          action: "confirm",

          assignments: assignments

        })

      });


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.error || "Save failed"
      );

    }


    message.innerText =
      "✅ Batting orders saved successfully.";

    message.className =
      "success-message";


    /* UPDATE LAST ORDER IN MEMORY */

    assignments.forEach(assignment => {

      const player =
        allPlayers.find(
          p => p.id === assignment.id
        );

      if (player) {

        player.lastOrder =
          assignment.battingOrder;

      }

    });


    localStorage.setItem(
      CACHE_KEY,
      JSON.stringify(allPlayers)
    );


  } catch (error) {

    console.error(error);

    message.innerText =
      "❌ Failed to save batting orders.";

    message.className =
      "error-message";

  }

}


/* SAFELY DISPLAY PLAYER NAMES */

function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* START */

loadPlayers();

</script>

</body>
</html>
