<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cricket Team & Batting Order</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        h2 {
            margin-top: 0;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }


        /* =============================================
           STATUS
           ============================================= */

        #status {
            text-align: center;
            font-weight: bold;
            min-height: 25px;
            margin: 15px 0;
        }


        /* =============================================
           GENERAL CARDS
           ============================================= */

        .card {
            background: white;
            border-radius: 12px;
            padding: 18px;
            margin-top: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }


        /* =============================================
           ALL PLAYERS
           ============================================= */

        .players-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }

        .player {
            padding: 14px 10px;
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            background: #fafafa;
            text-align: center;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: 0.15s;
        }

        .player:hover {
            transform: translateY(-1px);
        }

        .player:active {
            transform: scale(0.98);
        }

        .player.selected {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }


        /* =============================================
           TEAM SETUP
           ============================================= */

        .team-setup-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 18px;
            margin-top: 18px;
        }

        .team-box {
            background: white;
            border-radius: 12px;
            padding: 16px;
            min-height: 300px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        .team-box.drag-over {
            box-shadow: 0 0 0 3px #4caf50 inset;
        }

        .team-box h2 {
            text-align: center;
        }

        .unassigned-box h2 {
            color: #666;
        }

        .team1-box h2 {
            color: #1976d2;
        }

        .team2-box h2 {
            color: #f57c00;
        }

        .team-list {
            min-height: 200px;
        }

        .team-player {
            padding: 14px;
            margin: 8px 0;
            background: #f1f1f1;
            border: 1px solid #ddd;
            border-radius: 8px;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            transition: 0.15s;
        }

        .team-player.dragging {
            opacity: 0.4;
        }

        .team-player.mobile-selected {
            background: #1976d2;
            color: white;
            border-color: #1976d2;
        }

        .empty-message {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 30px 10px;
            text-align: center;
            color: #888;
            margin-top: 10px;
        }


        /* =============================================
           TEAM COUNTS
           ============================================= */

        .team-counts {
            text-align: center;
            background: white;
            padding: 15px;
            margin-top: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            font-size: 17px;
        }


        /* =============================================
           MOBILE MOVE CONTROLS
           ============================================= */

        .mobile-controls {
            display: none;
            background: white;
            padding: 16px;
            margin-top: 18px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        #selectedPlayerName {
            text-align: center;
            font-weight: bold;
            margin-bottom: 12px;
            min-height: 22px;
        }

        .mobile-move-buttons {
            display: flex;
            gap: 10px;
        }

        .mobile-move-buttons button {
            flex: 1;
        }


        /* =============================================
           BUTTONS
           ============================================= */

        .button-area {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 14px 24px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.95;
        }

        button:active {
            transform: scale(0.98);
        }

        .primary {
            background: #1976d2;
        }

        .secondary {
            background: #757575;
        }

        .success {
            background: #4caf50;
        }

        .shuffle {
            background: #673ab7;
        }

        .save {
            background: #00897b;
        }

        .move-unassigned {
            background: #757575;
        }

        .move-team1 {
            background: #1976d2;
        }

        .move-team2 {
            background: #f57c00;
        }


        /* =============================================
           BATTING ORDER
           ============================================= */

        .batting-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .batting-team {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .batting-player {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            margin: 8px 0;
            background: #f5f5f5;
            border-radius: 8px;
            font-weight: bold;
        }

        .batting-number {
            width: 38px;
            height: 38px;
            min-width: 38px;
            border-radius: 50%;
            background: #1976d2;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .team2-order .batting-number {
            background: #f57c00;
        }


        /* =============================================
           SAVE MESSAGE
           ============================================= */

        #saveMessage {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }

        .success-message {
            color: #2e7d32;
        }

        .error-message {
            color: #c62828;
        }


        /* =============================================
           MOBILE
           ============================================= */

        @media (max-width: 800px) {

            body {
                padding: 8px;
            }

            h1 {
                font-size: 24px;
            }

            .players-grid {
                grid-template-columns:
                    repeat(2, 1fr);
                gap: 8px;
            }

            .player {
                font-size: 14px;
                padding: 13px 6px;
            }

            .team-setup-grid {
                grid-template-columns: 1fr;
            }

            .team-box {
                min-height: 220px;
            }

            .team-player {
                padding: 16px;
                cursor: pointer;
                touch-action: manipulation;
            }

            .mobile-controls {
                display: block;
            }

            .mobile-move-buttons {
                flex-direction: column;
            }

            .batting-grid {
                grid-template-columns: 1fr;
            }

            .button-area {
                flex-direction: column;
            }

            .button-area button {
                width: 100%;
            }

        }

    </style>
</head>


<body>

<div class="container">


    <!-- =============================================
         SCREEN 1 - CREATE TEAMS
         ============================================= -->

    <div id="screen1"
         class="screen active">

        <h1>🏏 Create Cricket Teams</h1>

        <div id="status">
            Loading players...
        </div>


        <!-- ALL PLAYERS -->

        <div class="card">

            <h2>All Players</h2>

            <div id="allPlayers"
                 class="players-grid">
            </div>

        </div>


        <!-- TEAM ASSIGNMENT -->

        <div class="team-setup-grid">


            <!-- UNASSIGNED -->

            <div id="unassignedDropArea"
                 class="team-box unassigned-box"
                 ondragover="allowDrop(event)"
                 ondrop="dropPlayer(event, 'unassigned')"
                 ondragenter="dragEnter(event)"
                 ondragleave="dragLeave(event)">

                <h2>
                    ⏳ Unassigned
                </h2>

                <div id="unassignedPlayers"
                     class="team-list">
                </div>

            </div>


            <!-- TEAM 1 -->

            <div id="team1DropArea"
                 class="team-box team1-box"
                 ondragover="allowDrop(event)"
                 ondrop="dropPlayer(event, 'team1')"
                 ondragenter="dragEnter(event)"
                 ondragleave="dragLeave(event)">

                <h2>
                    🔵 Team 1
                </h2>

                <div id="team1Players"
                     class="team-list">
                </div>

            </div>


            <!-- TEAM 2 -->

            <div id="team2DropArea"
                 class="team-box team2-box"
                 ondragover="allowDrop(event)"
                 ondrop="dropPlayer(event, 'team2')"
                 ondragenter="dragEnter(event)"
                 ondragleave="dragLeave(event)">

                <h2>
                    🟠 Team 2
                </h2>

                <div id="team2Players"
                     class="team-list">
                </div>

            </div>

        </div>


        <!-- MOBILE MOVE CONTROLS -->

        <div class="mobile-controls">

            <div id="selectedPlayerName">
                Tap a player to move them
            </div>

            <div class="mobile-move-buttons">

                <button class="move-unassigned"
                        onclick="moveSelectedPlayer('unassigned')">

                    Move to Unassigned

                </button>


                <button class="move-team1"
                        onclick="moveSelectedPlayer('team1')">

                    Move to Team 1

                </button>


                <button class="move-team2"
                        onclick="moveSelectedPlayer('team2')">

                    Move to Team 2

                </button>

            </div>

        </div>


        <!-- COUNTS -->

        <div class="team-counts">

            Selected:
            <strong id="selectedCount">0</strong>

            &nbsp; | &nbsp;

            Unassigned:
            <strong id="unassignedCount">0</strong>

            &nbsp; | &nbsp;

            Team 1:
            <strong id="team1Count">0</strong>

            &nbsp; | &nbsp;

            Team 2:
            <strong id="team2Count">0</strong>

        </div>


        <div class="button-area">

            <button class="secondary"
                    onclick="clearSelection()">

                Clear Selection

            </button>


            <button class="success"
                    onclick="assignBattingOrder()">

                Assign Batting Order →

            </button>

        </div>

    </div>



    <!-- =============================================
         SCREEN 2 - BATTING ORDER
         ============================================= -->

    <div id="screen2"
         class="screen">

        <h1>🏆 Batting Order</h1>

        <div class="batting-grid">


            <!-- TEAM 1 -->

            <div class="batting-team">

                <h2>
                    🔵 Team 1
                </h2>

                <div id="battingTeam1">
                </div>

            </div>


            <!-- TEAM 2 -->

            <div class="batting-team">

                <h2>
                    🟠 Team 2
                </h2>

                <div id="battingTeam2"
                     class="team2-order">
                </div>

            </div>

        </div>


        <div id="saveMessage">
        </div>


        <div class="button-area">

            <button class="secondary"
                    onclick="changeTeams()">

                ← Change Teams

            </button>


            <button class="shuffle"
                    onclick="generateBattingOrders()">

                🎲 Regenerate Batting Order

            </button>


            <button class="save"
                    onclick="saveBattingOrders()">

                💾 Save Batting Orders

            </button>


            <button class="primary"
                    onclick="startAgain()">

                Start Again

            </button>

        </div>

    </div>


</div>



<script>


/* =============================================
   GOOGLE APPS SCRIPT API
   ============================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzLpnsEmypbynjiTA9jFVkvbw8YyALOe7q3boFgBNk-djd7xmPfWgIdRfDnh_C0L_yX/exec";


/* =============================================
   CACHE
   ============================================= */

const PLAYER_CACHE_KEY =
"cricketPlayers";

const CACHE_DURATION =
10 * 60 * 1000;


/* =============================================
   VARIABLES
   ============================================= */

let allPlayers = [];

let selectedPlayers = [];

let unassignedPlayers = [];

let team1 = [];

let team2 = [];

let selectedMobilePlayerId = null;


/* =============================================
   LOAD PLAYERS
   ============================================= */

function loadPlayers() {

    const status =
        document.getElementById("status");


    let cachedPlayers = null;


    try {

        const cached =
            localStorage.getItem(
                PLAYER_CACHE_KEY
            );


        if (cached) {

            cachedPlayers =
                JSON.parse(cached);

        }

    } catch (error) {

        console.log(
            "Cache error:",
            error
        );

    }


    if (
        Array.isArray(cachedPlayers) &&
        cachedPlayers.length > 0
    ) {

        allPlayers =
            cachedPlayers;

        renderAllPlayers();

        status.innerText =
            `${allPlayers.length} players loaded`;

    }


    fetch(API_URL)

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "HTTP " + response.status
                );

            }

            return response.json();

        })


        .then(data => {

            if (!data.success) {

                throw new Error(
                    data.error ||
                    "Unable to load players"
                );

            }


            allPlayers =
                data.players || [];


            try {

                localStorage.setItem(
                    PLAYER_CACHE_KEY,
                    JSON.stringify(allPlayers)
                );

            } catch (error) {

                console.log(
                    "Cache save error:",
                    error
                );

            }


            renderAllPlayers();

            status.innerText =
                `${allPlayers.length} players loaded`;

        })


        .catch(error => {

            console.error(
                "Load error:",
                error
            );


            if (
                allPlayers.length > 0
            ) {

                status.innerText =
                    `${allPlayers.length} players loaded`;

            } else {

                status.innerText =
                    "❌ Failed to load players";

            }

        });

}


/* =============================================
   RENDER ALL PLAYERS
   ============================================= */

function renderAllPlayers() {

    const container =
        document.getElementById("allPlayers");


    container.innerHTML = "";


    allPlayers.forEach(player => {

        const div =
            document.createElement("div");


        div.className =
            "player";


        div.innerText =
            player.name;


        if (
            selectedPlayers.some(
                p => p.id === player.id
            )
        ) {

            div.classList.add(
                "selected"
            );

        }


        div.onclick =
            function() {

                togglePlayerSelection(
                    player.id
                );

            };


        container.appendChild(div);

    });


    updateCounts();

}


/* =============================================
   SELECT / DESELECT PLAYER
   ============================================= */

function togglePlayerSelection(playerId) {

    const player =
        allPlayers.find(
            p => p.id === playerId
        );


    if (!player) {

        return;

    }


    const selectedIndex =
        selectedPlayers.findIndex(
            p => p.id === playerId
        );


    if (
        selectedIndex === -1
    ) {

        selectedPlayers.push(player);

        unassignedPlayers.push(player);

    } else {

        selectedPlayers =
            selectedPlayers.filter(
                p => p.id !== playerId
            );


        unassignedPlayers =
            unassignedPlayers.filter(
                p => p.id !== playerId
            );


        team1 =
            team1.filter(
                p => p.id !== playerId
            );


        team2 =
            team2.filter(
                p => p.id !== playerId
            );

    }


    renderAllPlayers();

    renderTeamSetup();

}


/* =============================================
   RENDER TEAM SETUP
   ============================================= */

function renderTeamSetup() {

    renderPlayerList(
        "unassignedPlayers",
        unassignedPlayers,
        "unassigned"
    );


    renderPlayerList(
        "team1Players",
        team1,
        "team1"
    );


    renderPlayerList(
        "team2Players",
        team2,
        "team2"
    );


    updateCounts();

    updateMobileSelection();

}


/* =============================================
   RENDER PLAYER LIST
   ============================================= */

function renderPlayerList(
    containerId,
    players,
    group
) {

    const container =
        document.getElementById(containerId);


    container.innerHTML = "";


    if (
        players.length === 0
    ) {

        container.innerHTML =
            `<div class="empty-message">
                No players
             </div>`;

        return;

    }


    players.forEach(player => {

        const div =
            document.createElement("div");


        div.className =
            "team-player";


        div.innerText =
            player.name;


        div.draggable = true;


        div.dataset.id =
            player.id;


        div.addEventListener(
            "dragstart",
            function(event) {

                event.dataTransfer.setData(
                    "text/plain",
                    player.id
                );

                div.classList.add(
                    "dragging"
                );

            }
        );


        div.addEventListener(
            "dragend",
            function() {

                div.classList.remove(
                    "dragging"
                );

            }
        );


        div.addEventListener(
            "click",
            function() {

                if (
                    window.innerWidth <= 800
                ) {

                    selectMobilePlayer(
                        player.id
                    );

                }

            }
        );


        container.appendChild(div);

    });

}


/* =============================================
   DRAG & DROP
   ============================================= */

function allowDrop(event) {

    event.preventDefault();

}


function dragEnter(event) {

    event.preventDefault();

    event.currentTarget.classList.add(
        "drag-over"
    );

}


function dragLeave(event) {

    event.currentTarget.classList.remove(
        "drag-over"
    );

}


function dropPlayer(
    event,
    target
) {

    event.preventDefault();

    event.currentTarget.classList.remove(
        "drag-over"
    );


    const playerId =
        event.dataTransfer.getData(
            "text/plain"
        );


    movePlayer(
        playerId,
        target
    );

}


/* =============================================
   MOVE PLAYER
   ============================================= */

function movePlayer(
    playerId,
    target
) {

    const player =
        selectedPlayers.find(
            p => p.id === playerId
        );


    if (!player) {

        return;

    }


    unassignedPlayers =
        unassignedPlayers.filter(
            p => p.id !== playerId
        );


    team1 =
        team1.filter(
            p => p.id !== playerId
        );


    team2 =
        team2.filter(
            p => p.id !== playerId
        );


    if (
        target === "unassigned"
    ) {

        unassignedPlayers.push(player);

    }


    if (
        target === "team1"
    ) {

        team1.push(player);

    }


    if (
        target === "team2"
    ) {

        team2.push(player);

    }


    renderTeamSetup();

}


/* =============================================
   MOBILE PLAYER SELECTION
   ============================================= */

function selectMobilePlayer(playerId) {

    selectedMobilePlayerId =
        playerId;

    updateMobileSelection();

}


function updateMobileSelection() {

    const nameElement =
        document.getElementById(
            "selectedPlayerName"
        );


    document.querySelectorAll(
        ".team-player"
    ).forEach(element => {

        if (
            element.dataset.id ===
            selectedMobilePlayerId
        ) {

            element.classList.add(
                "mobile-selected"
            );

        } else {

            element.classList.remove(
                "mobile-selected"
            );

        }

    });


    if (!selectedMobilePlayerId) {

        nameElement.innerText =
            "Tap a player to move them";

        return;

    }


    const player =
        selectedPlayers.find(
            p => p.id === selectedMobilePlayerId
        );


    if (player) {

        nameElement.innerText =
            "Selected: " + player.name;

    }

}


/* =============================================
   MOVE SELECTED MOBILE PLAYER
   ============================================= */

function moveSelectedPlayer(target) {

    if (!selectedMobilePlayerId) {

        alert(
            "Please tap a player first."
        );

        return;

    }


    movePlayer(
        selectedMobilePlayerId,
        target
    );


    selectedMobilePlayerId = null;

    updateMobileSelection();

}


/* =============================================
   UPDATE COUNTS
   ============================================= */

function updateCounts() {

    document.getElementById(
        "selectedCount"
    ).innerText =
        selectedPlayers.length;


    document.getElementById(
        "unassignedCount"
    ).innerText =
        unassignedPlayers.length;


    document.getElementById(
        "team1Count"
    ).innerText =
        team1.length;


    document.getElementById(
        "team2Count"
    ).innerText =
        team2.length;

}


/* =============================================
   CLEAR SELECTION
   ============================================= */

function clearSelection() {

    if (
        !confirm(
            "Clear all selected players and teams?"
        )
    ) {

        return;

    }


    selectedPlayers = [];

    unassignedPlayers = [];

    team1 = [];

    team2 = [];

    selectedMobilePlayerId = null;


    renderAllPlayers();

    renderTeamSetup();

}


/* =============================================
   ASSIGN BATTING ORDER
   ============================================= */

function assignBattingOrder() {

    if (
        team1.length === 0 ||
        team2.length === 0
    ) {

        alert(
            "Please add at least one player to both teams."
        );

        return;

    }


    if (
        unassignedPlayers.length > 0
    ) {

        alert(
            "Please assign all selected players to Team 1 or Team 2 before continuing."
        );

        return;

    }


    document.getElementById(
        "screen1"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "screen2"
    ).classList.add(
        "active"
    );


    generateBattingOrders();

}


/* =============================================
   GENERATE RANDOM BATTING ORDER
   ============================================= */

function generateBattingOrders() {

    team1 =
        randomizeTeam(team1);


    team2 =
        randomizeTeam(team2);


    renderBattingOrders();

}


function randomizeTeam(team) {

    const shuffled =
        [...team];


    for (
        let i =
            shuffled.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            shuffled[i],
            shuffled[j]
        ] =
        [
            shuffled[j],
            shuffled[i]
        ];

    }


    return shuffled.map(
        (player, index) => ({

            ...player,

            battingOrder:
                index + 1

        })
    );

}


/* =============================================
   DISPLAY BATTING ORDERS
   ============================================= */

function renderBattingOrders() {

    const team1Container =
        document.getElementById(
            "battingTeam1"
        );


    const team2Container =
        document.getElementById(
            "battingTeam2"
        );


    team1Container.innerHTML = "";

    team2Container.innerHTML = "";


    team1.forEach(player => {

        const div =
            document.createElement("div");


        div.className =
            "batting-player";


        div.innerHTML =
            `<div class="batting-number">
                ${player.battingOrder}
             </div>

             <div>
                ${player.name}
             </div>`;


        team1Container.appendChild(div);

    });


    team2.forEach(player => {

        const div =
            document.createElement("div");


        div.className =
            "batting-player";


        div.innerHTML =
            `<div class="batting-number">
                ${player.battingOrder}
             </div>

             <div>
                ${player.name}
             </div>`;


        team2Container.appendChild(div);

    });

}


/* =============================================
   SAVE BATTING ORDERS
   ============================================= */

async function saveBattingOrders() {

    const assignments = [];


    team1.forEach(player => {

        assignments.push({

            id: player.id,

            battingOrder:
                player.battingOrder

        });

    });


    team2.forEach(player => {

        assignments.push({

            id: player.id,

            battingOrder:
                player.battingOrder

        });

    });


    const message =
        document.getElementById(
            "saveMessage"
        );


    message.innerText =
        "Saving batting orders...";


    message.className = "";


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action: "confirm",

                            assignments:
                                assignments

                        })

                }
            );


        const result =
            await response.json();


        if (
            result.success
        ) {

            message.innerText =
                "✅ Batting orders saved successfully.";

            message.className =
                "success-message";

        } else {

            throw new Error(
                result.error ||
                "Save failed."
            );

        }

    } catch (error) {

        console.error(
            "Save error:",
            error
        );


        message.innerText =
            "❌ Failed to save batting orders.";

        message.className =
            "error-message";

    }

}

function changeTeams() {

    document.getElementById(
        "screen2"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "screen1"
    ).classList.add(
        "active"
    );

}

   ============================================= */

function startAgain() {

    selectedPlayers = [];

    unassignedPlayers = [];

    team1 = [];

    team2 = [];

    selectedMobilePlayerId = null;


    document.getElementById(
        "saveMessage"
    ).innerHTML = "";


    document.getElementById(
        "screen2"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "screen1"
    ).classList.add(
        "active"
    );


    renderAllPlayers();

    renderTeamSetup();

}

loadPlayers();
