<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Cricket Player Selection</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 15px;
}

.container {
    max-width: 1000px;
    margin: auto;
}

h1 {
    text-align: center;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

.team,
.assignment-team,
.final-team {
    background: white;
    padding: 20px;
    margin-top: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.players {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
}

.player {
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fafafa;
    text-align: center;
    cursor: pointer;
    user-select: none;
}

.player.selected {
    background: #4caf50;
    color: white;
}

#status {
    text-align: center;
    margin: 20px;
    font-weight: bold;
}

.selection-summary {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-top: 20px;
    text-align: center;
}

.instruction {
    text-align: center;
    background: #fff8e1;
    padding: 12px;
    border-radius: 8px;
    margin-top: 15px;
}

.assignment-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.assignment-team {
    min-height: 350px;
}

.assignment-team.drag-over {
    background: #e8f5e9;
}

.drop-zone {
    min-height: 250px;
}

.assigned-player {
    padding: 15px;
    margin: 8px 0;
    border-radius: 8px;
    background: #f1f1f1;
    border: 1px solid #ddd;
    cursor: grab;
    user-select: none;

    /*
     * Important for touch devices
     */
    touch-action: none;
}

.assigned-player.dragging {
    opacity: 0.4;
}

.empty-message {
    text-align: center;
    color: #888;
    padding: 50px 10px;
    border: 2px dashed #ccc;
    border-radius: 8px;
}

.batting-player {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    margin: 8px 0;
    background: #f5f5f5;
    border-radius: 8px;
    font-weight: bold;
}

.batting-number {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #1976d2;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;
}

.team2-batting .batting-number {
    background: #ff9800;
}

.button-area {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin: 25px 0;
}

button {
    padding: 13px 28px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: white;
}

.primary {
    background: #1976d2;
}

.secondary {
    background: #777;
}

.shuffle {
    background: #673ab7;
}

.success {
    background: #4caf50;
}

.save {
    background: #00897b;
}

.saved-message {
    text-align: center;
    padding: 12px;
    margin-top: 20px;
    border-radius: 8px;
    font-weight: bold;
}

.success-message {
    background: #e8f5e9;
    color: #2e7d32;
}

.error-message {
    background: #ffebee;
    color: #c62828;
}


/* ============================
   MOBILE
   ============================ */

@media (max-width: 700px) {

    body {
        padding: 8px;
    }

    .assignment-area {
        grid-template-columns: 1fr;
    }

    .players {
        grid-template-columns:
            repeat(2, 1fr);
    }

    button {
        width: 100%;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     SCREEN 1
     ===================================================== -->

<div id="screen1"
     class="screen active">

<h1>
🏏 Cricket Player Selection
</h1>

<div id="status">
Loading players...
</div>


<div class="team">

<h2>Team A</h2>

<div id="teamA"
     class="players"></div>

</div>


<div class="team">

<h2>Team B</h2>

<div id="teamB"
     class="players"></div>

</div>


<div class="selection-summary">

Selected Players:

<strong id="selectedCount">
0
</strong>

</div>


<div class="button-area">

<button class="primary"
        onclick="goToAssignment()">

Continue

</button>

</div>

</div>



<!-- =====================================================
     SCREEN 2
     ===================================================== -->

<div id="screen2"
     class="screen">

<h1>
🎲 Create Two Teams
</h1>


<div class="instruction">

<strong>Desktop:</strong>
Drag players between teams.

<br>

<strong>Mobile:</strong>
Touch support will be enabled next.

</div>


<div class="assignment-area">


<div id="team1DropArea"
     class="assignment-team"
     ondragover="allowDrop(event)"
     ondrop="dropPlayer(event,1)">

<h2>
🔵 Team 1
</h2>

<div id="team1Players"
     class="drop-zone"></div>

</div>


<div id="team2DropArea"
     class="assignment-team"
     ondragover="allowDrop(event)"
     ondrop="dropPlayer(event,2)">

<h2>
🟠 Team 2
</h2>

<div id="team2Players"
     class="drop-zone"></div>

</div>

</div>


<div class="selection-summary">

Team 1:

<strong id="team1Count">
0
</strong>

&nbsp;&nbsp; | &nbsp;&nbsp;

Team 2:

<strong id="team2Count">
0
</strong>

</div>


<div class="button-area">

<button class="shuffle"
        onclick="shuffleTeams()">

🎲 Shuffle Again

</button>


<button class="secondary"
        onclick="goBackToSelection()">

← Back

</button>


<button class="success"
        onclick="finishTeams()">

Create Teams

</button>

</div>

</div>



<!-- =====================================================
     SCREEN 3
     ===================================================== -->

<div id="screen3"
     class="screen">

<h1>
🏆 Batting Order
</h1>


<div class="final-team">

<h2>
🔵 Team 1
</h2>

<div id="finalTeam1"></div>

</div>


<div class="final-team">

<h2>
🟠 Team 2
</h2>

<div id="finalTeam2"
     class="team2-batting"></div>

</div>


<div id="saveMessage"></div>


<div class="button-area">

<button class="secondary"
        onclick="goBackToAssignment()">

← Modify Teams

</button>


<button class="shuffle"
        onclick="generateBattingOrders()">

🎲 Regenerate Orders

</button>


<button class="save"
        onclick="saveBattingOrders()">

💾 Save Batting Orders

</button>


<button class="primary"
        onclick="startAgain()">

Start Again

</button>

</div>

</div>


</div>



<script>


/* =====================================================
   GOOGLE APPS SCRIPT API
   ===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzLpnsEmypbynjiTA9jFVkvbw8YyALOe7q3boFgBNk-djd7xmPfWgIdRfDnh_C0L_yX/exec";


/* =====================================================
   VARIABLES
   ===================================================== */

let allPlayers = [];

let selectedPlayers = [];

let team1 = [];

let team2 = [];

let draggedPlayerId = null;



/* =====================================================
   LOAD PLAYERS
   ===================================================== */

function loadPlayers() {

    fetch(API_URL)

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "HTTP " + response.status
                );

            }

            return response.json();

        })

        .then(data => {

            if (!data.success) {

                throw new Error(
                    data.error ||
                    "Unable to load players"
                );

            }


            allPlayers =
                data.players || [];


            document.getElementById(
                "status"
            ).innerText =
                `${allPlayers.length} players loaded successfully`;


            const teamA =
                document.getElementById(
                    "teamA"
                );


            const teamB =
                document.getElementById(
                    "teamB"
                );


            teamA.innerHTML = "";

            teamB.innerHTML = "";


            allPlayers.forEach(
                player => {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "player";


                    div.innerText =
                        player.name;


                    div.dataset.id =
                        player.id;


                    div.onclick =
                        function() {

                            togglePlayer(
                                player.id,
                                div
                            );

                        };


                    if (
                        player.team === "A"
                    ) {

                        teamA.appendChild(
                            div
                        );

                    } else {

                        teamB.appendChild(
                            div
                        );

                    }

                }
            );


        })

        .catch(error => {

            console.error(
                "Load players error:",
                error
            );


            document.getElementById(
                "status"
            ).innerText =
                "❌ Failed to load players";

        });

}



/* =====================================================
   SELECT PLAYER
   ===================================================== */

function togglePlayer(
    playerId,
    element
) {

    const index =
        selectedPlayers.findIndex(
            player =>
                player.id === playerId
        );


    if (index === -1) {

        const player =
            allPlayers.find(
                player =>
                    player.id === playerId
            );


        selectedPlayers.push(
            player
        );


        element.classList.add(
            "selected"
        );

    } else {

        selectedPlayers.splice(
            index,
            1
        );


        element.classList.remove(
            "selected"
        );

    }


    document.getElementById(
        "selectedCount"
    ).innerText =
        selectedPlayers.length;

}



/* =====================================================
   GO TO TEAM ASSIGNMENT
   ===================================================== */

function goToAssignment() {

    if (
        selectedPlayers.length < 2
    ) {

        alert(
            "Please select at least 2 players."
        );

        return;

    }


    document.getElementById(
        "screen1"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "screen2"
    ).classList.add(
        "active"
    );


    shuffleTeams();

}



/* =====================================================
   SHUFFLE TEAMS
   ===================================================== */

function shuffleTeams() {

    let shuffled =
        [...selectedPlayers];


    for (
        let i =
            shuffled.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            shuffled[i],
            shuffled[j]
        ] =
        [
            shuffled[j],
            shuffled[i]
        ];

    }


    const middle =
        Math.ceil(
            shuffled.length / 2
        );


    team1 =
        shuffled.slice(
            0,
            middle
        );


    team2 =
        shuffled.slice(
            middle
        );


    renderAssignment();

}



/* =====================================================
   RENDER TEAMS
   ===================================================== */

function renderAssignment() {

    const team1Container =
        document.getElementById(
            "team1Players"
        );


    const team2Container =
        document.getElementById(
            "team2Players"
        );


    team1Container.innerHTML = "";

    team2Container.innerHTML = "";


    team1.forEach(
        player => {

            createPlayerCard(
                player,
                team1Container
            );

        }
    );


    team2.forEach(
        player => {

            createPlayerCard(
                player,
                team2Container
            );

        }
    );


    document.getElementById(
        "team1Count"
    ).innerText =
        team1.length;


    document.getElementById(
        "team2Count"
    ).innerText =
        team2.length;

}



/* =====================================================
   PLAYER CARD
   ===================================================== */

function createPlayerCard(
    player,
    container
) {

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "assigned-player";


    div.innerText =
        player.name;


    div.draggable =
        true;


    div.dataset.id =
        player.id;


    div.addEventListener(
        "dragstart",
        function(event) {

            draggedPlayerId =
                player.id;


            event.dataTransfer
                .setData(
                    "text/plain",
                    player.id
                );


            div.classList.add(
                "dragging"
            );

        }
    );


    div.addEventListener(
        "dragend",
        function() {

            div.classList.remove(
                "dragging"
            );

            draggedPlayerId =
                null;

        }
    );


    container.appendChild(
        div
    );

}



/* =====================================================
   DESKTOP DROP
   ===================================================== */

function allowDrop(event) {

    event.preventDefault();

}


function dropPlayer(
    event,
    targetTeam
) {

    event.preventDefault();


    const playerId =
        event.dataTransfer
            .getData(
                "text/plain"
            );


    if (!playerId) {

        return;

    }


    team1 =
        team1.filter(
            p =>
                p.id !== playerId
        );


    team2 =
        team2.filter(
            p =>
                p.id !== playerId
        );


    const player =
        allPlayers.find(
            p =>
                p.id === playerId
        );


    if (
        targetTeam === 1
    ) {

        team1.push(
            player
        );

    } else {

        team2.push(
            player
        );

    }


    renderAssignment();

}



/* =====================================================
   CREATE TEAMS
   ===================================================== */

function finishTeams() {

    if (
        team1.length === 0 ||
        team2.length === 0
    ) {

        alert(
            "Both teams must have at least one player."
        );

        return;

    }


    document.getElementById(
        "screen2"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "screen3"
    ).classList.add(
        "active"
    );


    generateBattingOrders();

}



/* =====================================================
   RANDOM BATTING ORDER
   ===================================================== */

function generateBattingOrders() {

    team1 =
        randomizeBattingOrder(
            team1
        );


    team2 =
        randomizeBattingOrder(
            team2
        );


    renderFinalTeams();

}


function randomizeBattingOrder(
    team
) {

    const shuffled =
        [...team];


    for (
        let i =
            shuffled.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            shuffled[i],
            shuffled[j]
        ] =
        [
            shuffled[j],
            shuffled[i]
        ];

    }


    return shuffled.map(
        (player, index) => ({

            ...player,

            battingOrder:
                index + 1

        })
    );

}



/* =====================================================
   DISPLAY FINAL TEAMS
   ===================================================== */

function renderFinalTeams() {

    const finalTeam1 =
        document.getElementById(
            "finalTeam1"
        );


    const finalTeam2 =
        document.getElementById(
            "finalTeam2"
        );


    finalTeam1.innerHTML = "";

    finalTeam2.innerHTML = "";


    team1.forEach(
        player => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "batting-player";


            div.innerHTML =
                `<div class="batting-number">
                    ${player.battingOrder}
                 </div>
                 <div>
                    ${player.name}
                 </div>`;


            finalTeam1.appendChild(
                div
            );

        }
    );


    team2.forEach(
        player => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "batting-player";


            div.innerHTML =
                `<div class="batting-number">
                    ${player.battingOrder}
                 </div>
                 <div>
                    ${player.name}
                 </div>`;


            finalTeam2.appendChild(
                div
            );

        }
    );

}



/* =====================================================
   SAVE TO GOOGLE SHEETS
   ===================================================== */

async function saveBattingOrders() {

    const assignments = [];


    team1.forEach(
        player => {

            assignments.push({

                id:
                    player.id,

                battingOrder:
                    player.battingOrder

            });

        }
    );


    team2.forEach(
        player => {

            assignments.push({

                id:
                    player.id,

                battingOrder:
                    player.battingOrder

            });

        }
    );


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify({

                            action:
                                "confirm",

                            assignments:
                                assignments

                        })

                }
            );


        const result =
            await response.json();


        const message =
            document.getElementById(
                "saveMessage"
            );


        if (
            result.success
        ) {

            message.innerText =
                "✅ Batting orders saved successfully to Google Sheets.";

            message.className =
                "saved-message success-message";

        } else {

            throw new Error(
                result.error
            );

        }


    } catch (error) {

        console.error(error);


        const message =
            document.getElementById(
                "saveMessage"
            );


        message.innerText =
            "❌ Failed to save batting orders.";

        message.className =
            "saved-message error-message";

    }

}



/* =====================================================
   NAVIGATION
   ===================================================== */

function goBackToSelection() {

    document.getElementById(
        "screen2"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "screen1"
    ).classList.add(
        "active"
    );

}


function goBackToAssignment() {

    document.getElementById(
        "screen3"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "screen2"
    ).classList.add(
        "active"
    );

}


function startAgain() {

    selectedPlayers = [];

    team1 = [];

    team2 = [];


    document.querySelectorAll(
        ".player"
    ).forEach(
        element =>
            element.classList.remove(
                "selected"
            )
    );


    document.getElementById(
        "selectedCount"
    ).innerText =
        "0";


    document.getElementById(
        "screen3"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "screen1"
    ).classList.add(
        "active"
    );

}



/* =====================================================
   START APP
   ===================================================== */

loadPlayers();


</script>

</body>

</html>
