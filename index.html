<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cricket Player Selection</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .team {
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .players {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(150px, 1fr));

            gap: 10px;
        }

        .player {
            padding: 14px 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #fafafa;
            cursor: pointer;
            text-align: center;
            user-select: none;
        }

        .player:hover {
            background: #e8f0fe;
        }

        .player.selected {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        #status {
            text-align: center;
            margin: 20px;
            font-weight: bold;
        }

        .selection-summary {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .instruction {
            text-align: center;
            background: #fff8e1;
            border: 1px solid #ffe082;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .assignment-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .assignment-team {
            background: white;
            padding: 20px;
            border-radius: 12px;
            min-height: 300px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);

            transition: 0.2s;
        }

        .assignment-team.team1 {
            border-top: 5px solid #1976d2;
        }

        .assignment-team.team2 {
            border-top: 5px solid #ff9800;
        }

        .assignment-team.drag-over {
            background: #e8f5e9;
            transform: scale(1.01);
        }

        .assignment-team h2 {
            text-align: center;
        }

        .drop-zone {
            min-height: 220px;
        }

        .assigned-player {
            padding: 14px;

            margin: 8px 0;

            border-radius: 8px;

            background: #f1f1f1;

            text-align: center;

            cursor: grab;

            border: 1px solid #ddd;

            user-select: none;

            transition: 0.2s;
        }

        .assigned-player:hover {
            background: #e0e0e0;
        }

        .assigned-player:active {
            cursor: grabbing;
        }

        .assigned-player.dragging {
            opacity: 0.4;
        }

        .empty-message {
            text-align: center;
            color: #888;
            padding: 50px 10px;
            border: 2px dashed #ccc;
            border-radius: 8px;
        }

        .button-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 25px 0;
        }

        button {
            padding: 13px 28px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
        }

        .primary {
            background: #1976d2;
        }

        .primary:hover {
            background: #125ca1;
        }

        .secondary {
            background: #777;
        }

        .secondary:hover {
            background: #555;
        }

        .shuffle {
            background: #673ab7;
        }

        .shuffle:hover {
            background: #512da8;
        }

        .success {
            background: #4caf50;
        }

        .success:hover {
            background: #388e3c;
        }

        .final-team {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.1);
        }

        .final-team h2 {
            text-align: center;
        }

        .final-player {
            padding: 12px;
            margin: 8px 0;
            background: #f5f5f5;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .assignment-area {
                grid-template-columns: 1fr;
            }

            .players {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- SCREEN 1 -->

    <div id="screen1" class="screen active">

        <h1>🏏 Cricket Player Selection</h1>

        <div id="status">
            Loading players...
        </div>


        <div class="team">

            <h2>Team A</h2>

            <div id="teamA" class="players"></div>

        </div>


        <div class="team">

            <h2>Team B</h2>

            <div id="teamB" class="players"></div>

        </div>


        <div class="selection-summary">

            Selected Players:

            <strong id="selectedCount">
                0
            </strong>

        </div>


        <div class="button-area">

            <button
                class="primary"
                onclick="goToAssignment()">

                Continue

            </button>

        </div>

    </div>



    <!-- SCREEN 2 -->

    <div id="screen2" class="screen">


        <h1>🎲 Create Two Teams</h1>


        <div class="instruction">

            First the selected players are shuffled
            automatically.

            <br><br>

            <strong>
                Drag and drop players between Team 1
                and Team 2.
            </strong>

        </div>


        <div class="selection-summary">

            🔵 Team 1:

            <strong id="team1Count">
                0
            </strong>

            &nbsp;&nbsp; | &nbsp;&nbsp;

            🟠 Team 2:

            <strong id="team2Count">
                0
            </strong>

        </div>



        <div class="assignment-area">


            <!-- TEAM 1 -->

            <div
                id="team1DropArea"
                class="assignment-team team1"
                ondragover="allowDrop(event)"
                ondrop="dropPlayer(event, 1)"
                ondragenter="dragEnter(event)"
                ondragleave="dragLeave(event)"
            >

                <h2>
                    🔵 Team 1
                </h2>

                <div
                    id="team1Players"
                    class="drop-zone">

                </div>

            </div>



            <!-- TEAM 2 -->

            <div
                id="team2DropArea"
                class="assignment-team team2"
                ondragover="allowDrop(event)"
                ondrop="dropPlayer(event, 2)"
                ondragenter="dragEnter(event)"
                ondragleave="dragLeave(event)"
            >

                <h2>
                    🟠 Team 2
                </h2>

                <div
                    id="team2Players"
                    class="drop-zone">

                </div>

            </div>


        </div>



        <div class="button-area">


            <button
                class="shuffle"
                onclick="shuffleTeams()">

                🎲 Shuffle Again

            </button>


            <button
                class="secondary"
                onclick="goBackToSelection()">

                ← Back

            </button>


            <button
                class="success"
                onclick="finishTeams()">

                Create Teams

            </button>


        </div>


    </div>



    <!-- SCREEN 3 -->

    <div id="screen3" class="screen">


        <h1>
            🏆 Final Teams
        </h1>


        <div class="final-team">

            <h2>
                🔵 Team 1
            </h2>

            <div id="finalTeam1"></div>

        </div>


        <div class="final-team">

            <h2>
                🟠 Team 2
            </h2>

            <div id="finalTeam2"></div>

        </div>


        <div class="button-area">


            <button
                class="secondary"
                onclick="goBackToAssignment()">

                ← Modify Teams

            </button>


            <button
                class="primary"
                onclick="startAgain()">

                Start Again

            </button>


        </div>


    </div>


</div>



<script>


const API_URL =
"https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQDKhsU35eReJfpy09N4OxRXdemyHQxAIcIIEkC8vVSgOuXP1QBEkOgrOtzsHE5avlQNQqCUWWUTXylbWBYj3V0m1_Suhia1ghb1AxvWIhxHJ7ZW3k8qQTcV_Te64TldzlxBLiLwdDXuuUOtxSABymZmGSpEIKH77ZRTp1cMz0tIv7ns96vkGDE1ZSTMWG2dcCmvHEJUNRnREbAlWr1n0H36gL1XNInOMYONf6aELqkbrJF2Rb18NKeS7fRbg1kNqGHLGVrHblFztJ5YeGZdbR830FS_w&lib=MR8tRzo_3YwvEnMJAOT5QmwS7g1xLMLOv";


let allPlayers = [];

let selectedPlayers = [];

let team1 = [];

let team2 = [];

let draggedPlayerId = null;



/* LOAD PLAYERS */


async function loadPlayers() {

    try {

        const response =
            await fetch(API_URL);

        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                "Unable to load players"
            );

        }


        allPlayers =
            data.players;


        document.getElementById(
            "status"
        ).innerText =
            `${allPlayers.length} players loaded successfully`;


        const teamA =
            document.getElementById(
                "teamA"
            );


        const teamB =
            document.getElementById(
                "teamB"
            );


        teamA.innerHTML = "";

        teamB.innerHTML = "";


        allPlayers.forEach(
            player => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "player";


                div.innerText =
                    player.name;


                div.dataset.id =
                    player.id;


                div.onclick =
                    function() {

                        togglePlayer(
                            player.id,
                            div
                        );

                    };


                if (
                    player.team === "A"
                ) {

                    teamA.appendChild(
                        div
                    );

                } else {

                    teamB.appendChild(
                        div
                    );

                }

            }
        );


    } catch (error) {

        console.error(error);


        document.getElementById(
            "status"
        ).innerText =
            "❌ Failed to load players";

    }

}



/* SELECT PLAYERS */


function togglePlayer(
    playerId,
    element
) {

    const index =
        selectedPlayers.findIndex(
            player =>
                player.id === playerId
        );


    if (index === -1) {

        const player =
            allPlayers.find(
                player =>
                    player.id === playerId
            );


        selectedPlayers.push(
            player
        );


        element.classList.add(
            "selected"
        );

    } else {

        selectedPlayers.splice(
            index,
            1
        );


        element.classList.remove(
            "selected"
        );

    }


    updateSelectedCount();

}



/* COUNT */


function updateSelectedCount() {

    document.getElementById(
        "selectedCount"
    ).innerText =
        selectedPlayers.length;

}



/* GO TO TEAM CREATION */


function goToAssignment() {

    if (
        selectedPlayers.length < 2
    ) {

        alert(
            "Please select at least 2 players."
        );

        return;

    }


    document.getElementById(
        "screen1"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "screen2"
    ).classList.add(
        "active"
    );


    shuffleTeams();

}



/* SHUFFLE */


function shuffleTeams() {

    team1 = [];

    team2 = [];


    let shuffled =
        [...selectedPlayers];


    for (
        let i =
            shuffled.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            shuffled[i],
            shuffled[j]
        ] =
        [
            shuffled[j],
            shuffled[i]
        ];

    }


    const middle =
        Math.ceil(
            shuffled.length / 2
        );


    team1 =
        shuffled.slice(
            0,
            middle
        );


    team2 =
        shuffled.slice(
            middle
        );


    renderAssignment();

}



/* RENDER TEAMS */


function renderAssignment() {

    const team1Container =
        document.getElementById(
            "team1Players"
        );


    const team2Container =
        document.getElementById(
            "team2Players"
        );


    team1Container.innerHTML = "";

    team2Container.innerHTML = "";


    if (
        team1.length === 0
    ) {

        team1Container.innerHTML =
            '<div class="empty-message">' +
            'Drop players here' +
            '</div>';

    }


    if (
        team2.length === 0
    ) {

        team2Container.innerHTML =
            '<div class="empty-message">' +
            'Drop players here' +
            '</div>';

    }


    team1.forEach(
        player => {

            createPlayerCard(
                player,
                team1Container
            );

        }
    );


    team2.forEach(
        player => {

            createPlayerCard(
                player,
                team2Container
            );

        }
    );


    document.getElementById(
        "team1Count"
    ).innerText =
        team1.length;


    document.getElementById(
        "team2Count"
    ).innerText =
        team2.length;

}



/* CREATE DRAGGABLE PLAYER CARD */


function createPlayerCard(
    player,
    container
) {

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "assigned-player";


    div.innerText =
        player.name;


    div.draggable = true;


    div.dataset.id =
        player.id;


    div.ondragstart =
        function(event) {

            draggedPlayerId =
                player.id;


            event.dataTransfer
                .setData(
                    "text/plain",
                    player.id
                );


            div.classList.add(
                "dragging"
            );

        };


    div.ondragend =
        function() {

            div.classList.remove(
                "dragging"
            );

            draggedPlayerId =
                null;

        };


    container.appendChild(
        div
    );

}



/* ALLOW DROP */


function allowDrop(event) {

    event.preventDefault();

}



/* DRAG ENTER */


function dragEnter(event) {

    event.preventDefault();


    const dropArea =
        event.currentTarget;


    dropArea.classList.add(
        "drag-over"
    );

}



/* DRAG LEAVE */


function dragLeave(event) {

    const dropArea =
        event.currentTarget;


    dropArea.classList.remove(
        "drag-over"
    );

}



/* DROP PLAYER */


function dropPlayer(
    event,
    targetTeam
) {

    event.preventDefault();


    const dropArea =
        event.currentTarget;


    dropArea.classList.remove(
        "drag-over"
    );


    const playerId =
        event.dataTransfer.getData(
            "text/plain"
        );


    if (!playerId) {

        return;

    }


    const player =
        allPlayers.find(
            p =>
                p.id === playerId
        );


    if (!player) {

        return;

    }


    /*
       Remove player from
       both teams first.
    */

    team1 =
        team1.filter(
            p =>
                p.id !== playerId
        );


    team2 =
        team2.filter(
            p =>
                p.id !== playerId
        );


    /*
       Add player to
       selected target team.
    */

    if (
        targetTeam === 1
    ) {

        team1.push(
            player
        );

    } else {

        team2.push(
            player
        );

    }


    renderAssignment();

}



/* FINISH TEAMS */


function finishTeams() {

    if (
        team1.length === 0 ||
        team2.length === 0
    ) {

        alert(
            "Both teams must have at least one player."
        );

        return;

    }


    document.getElementById(
        "screen2"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "screen3"
    ).classList.add(
        "active"
    );


    renderFinalTeams();

}



/* FINAL TEAMS */


function renderFinalTeams() {

    const finalTeam1 =
        document.getElementById(
            "finalTeam1"
        );


    const finalTeam2 =
        document.getElementById(
            "finalTeam2"
        );


    finalTeam1.innerHTML = "";

    finalTeam2.innerHTML = "";


    team1.forEach(
        (player, index) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "final-player";


            div.innerText =
                `${index + 1}. ${player.name}`;


            finalTeam1.appendChild(
                div
            );

        }
    );


    team2.forEach(
        (player, index) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "final-player";


            div.innerText =
                `${index + 1}. ${player.name}`;


            finalTeam2.appendChild(
                div
            );

        }
    );

}



/* BACK TO SELECTION */


function goBackToSelection() {

    document.getElementById(
        "screen2"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "screen1"
    ).classList.add(
        "active"
    );

}



/* BACK TO ASSIGNMENT */


function goBackToAssignment() {

    document.getElementById(
        "screen3"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "screen2"
    ).classList.add(
        "active"
    );

}



/* START AGAIN */


function startAgain() {

    selectedPlayers = [];

    team1 = [];

    team2 = [];


    document.querySelectorAll(
        ".player"
    ).forEach(
        element =>
            element.classList.remove(
                "selected"
            )
    );


    updateSelectedCount();


    document.getElementById(
        "screen3"
    ).classList.remove(
        "active"
    );


    document.getElementById(
        "screen1"
    ).classList.add(
        "active"
    );

}



/* START APPLICATION */


loadPlayers();

</script>


</body>
</html>
